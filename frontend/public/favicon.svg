<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    Task Nexio favicon — 32×32
    App icon treatment from brand identity board:
    dark rounded square background + N mark (two parallel diagonal bars +
    play triangle + chartreuse accent)
  -->
  <rect width="32" height="32" rx="7" fill="#111111"/>

  <defs>
    <linearGradient id="fav-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2563FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!--
    N mark scaled to fit 32×32 with ~2px padding.
    Original viewBox: 0 0 100 100 → scale 0.28, translate (2, 2)
  -->
  <g transform="translate(2,2) scale(0.28)">
    <polygon points="10,96  34,96  50,10  26,10" fill="url(#fav-g)"/>
    <polygon points="46,96  70,96  86,10  62,10" fill="url(#fav-g)"/>
    <polygon points="50,10  62,10  62,40  50,40" fill="url(#fav-g)"/>
    <polygon points="62,10  86,10  62,40"         fill="#C4FF00"/>
    <polygon points="4,66   24,82  4,98"           fill="url(#fav-g)"/>
  </g>
</svg>
