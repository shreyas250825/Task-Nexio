<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 110" fill="none"
     role="img" aria-label="Task Nexio — A Valen Labs Product">
  <!--
    Task Nexio horizontal lockup — LIGHT background variant
    "Task" in near-black #111111, "Nexio" in blue #2563FF
    Symbol is the correct two-bar N mark with blue→violet gradient + chartreuse accent
  -->
  <defs>
    <linearGradient id="ll-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2563FF"/>
      <stop offset="45%"  stop-color="#5B4FEE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- N mark at left, scaled to fit 100-tall canvas -->
  <g transform="translate(0,5)">
    <polygon points="10,95  34,95  50,9   26,9"  fill="url(#ll-g)"/>
    <polygon points="46,95  70,95  86,9   62,9"  fill="url(#ll-g)"/>
    <polygon points="50,9   62,9   62,39  50,39" fill="url(#ll-g)"/>
    <polygon points="62,9   86,9   62,39"         fill="#C4FF00"/>
    <polygon points="4,65   24,81  4,97"           fill="url(#ll-g)"/>
  </g>

  <!-- "Task" — extra-bold, near-black -->
  <text x="110" y="72"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="60" font-weight="800"
        letter-spacing="-2"
        fill="#111111">Task</text>

  <!-- "Nexio" — extra-bold, bright blue -->
  <text x="258" y="72"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="60" font-weight="800"
        letter-spacing="-2"
        fill="#2563FF">Nexio</text>

  <!-- Tagline -->
  <text x="111" y="96"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="400"
        letter-spacing="3"
        fill="#888888">A VALEN LABS PRODUCT.</text>
</svg>
