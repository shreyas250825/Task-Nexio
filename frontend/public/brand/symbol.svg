<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"
     role="img" aria-label="Task Nexio symbol">
  <!--
    Task Nexio N mark — faithfully reconstructed from official brand references.

    Structure (from brand identity board / mark construction grid):
      1. Left diagonal bar  — thick parallelogram, bottom-left → top-right
      2. Right diagonal bar — identical bar, offset right (~36 units)
      3. Top connector      — rectangular bridge between bars at top
      4. Play arrow         — right-pointing triangle, bottom-left of mark
      5. Chartreuse accent  — yellow-green right-triangle, top-right notch

    Gradient: bright blue #2563FF (top-left) → violet #7C3AED (bottom-right)
    Chartreuse: #C4FF00
  -->
  <defs>
    <linearGradient id="sym-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2563FF"/>
      <stop offset="45%"  stop-color="#5B4FEE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Left diagonal bar -->
  <polygon points="10,96  34,96  50,10  26,10" fill="url(#sym-g)"/>

  <!-- Right diagonal bar -->
  <polygon points="46,96  70,96  86,10  62,10" fill="url(#sym-g)"/>

  <!-- Top connector (bridges the gap between bars at top) -->
  <polygon points="50,10  62,10  62,40  50,40" fill="url(#sym-g)"/>

  <!-- Chartreuse accent triangle — top-right notch -->
  <polygon points="62,10  86,10  62,40" fill="#C4FF00"/>

  <!-- Play arrow — right-pointing triangle, bottom-left -->
  <polygon points="4,66  24,82  4,98" fill="url(#sym-g)"/>
</svg>
